# Collect settlement gas data from public Arbitrum Sepolia RPCs and publish the
# static dashboard to GitHub Pages. Runs every 10 min; every run is incremental and
# checkpointed, so a run that hits its time budget simply resumes on the next tick.
#
# State lives in the Actions cache between runs (fast, no commit noise) and is
# checkpointed into git every 6 h so a cache eviction costs at most 6 h of re-scan.
# To restart from scratch: delete data/ in git AND bump DATA_EPOCH below.
#
# Repo settings needed once: Settings → Pages → Source = "GitHub Actions".
# Optional secret RPC_URLS (comma-separated) to add a keyed provider for speed.
name: gas-dashboard

on:
  schedule:
    - cron: "*/10 * * * *"    # every 10 min; the concurrency group queues at most one run behind a long one
  workflow_dispatch:
    inputs:
      max_run_minutes:
        description: "Collector time budget (minutes)"
        default: "45"

permissions:
  contents: write            # commit data/ back to the repo
  actions: write             # re-dispatch this workflow
  pages: write
  id-token: write

env:
  DATA_EPOCH: "1"

concurrency:
  group: gas-dashboard
  cancel-in-progress: false   # never kill a run mid-chunk; it checkpoints and exits on its own

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Unit tests
        run: node --test

      - name: Restore data from cache (newer than the git checkpoint)
        if: hashFiles('data/state.json') != ''      # a deleted data/ in git means "restart" — do not resurrect old state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data
          key: gas-data-${{ env.DATA_EPOCH }}-${{ github.run_id }}
          restore-keys: gas-data-${{ env.DATA_EPOCH }}-

      - name: Collect
        env:
          RPC_URLS: ${{ secrets.RPC_URLS }}          # empty → built-in public endpoints
          MAX_RUN_MINUTES: ${{ github.event.inputs.max_run_minutes || '45' }}
        run: node collect.mjs

      - name: Decide whether to checkpoint into git (every 6 h, or on manual dispatch)
        id: ckpt
        run: |
          last=$(cat data/.checkpoint 2>/dev/null || echo 0)
          age=$(( $(date +%s) - last ))
          if [ "$age" -ge 21600 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            date +%s > data/.checkpoint; echo "commit=true" >> "$GITHUB_OUTPUT"; echo "checkpoint (last one ${age}s ago)"
          else
            echo "commit=false" >> "$GITHUB_OUTPUT"; echo "last checkpoint ${age}s ago; cache only"
          fi

      - name: Save data to cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data
          key: gas-data-${{ env.DATA_EPOCH }}-${{ github.run_id }}

      - name: Checkpoint data into git
        if: steps.ckpt.outputs.commit == 'true'
        run: |
          git config user.name "gas-dashboard[bot]"
          git config user.email "gas-dashboard@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no data change"; exit 0; fi
          git commit -m "data: live through block $(node -p "require('./data/state.json').cursors.live.lastBlock")"
          # another run may have pushed meanwhile: rebase, never force
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Assemble site
        run: |
          rm -rf _site && mkdir -p _site
          cp -r site/. _site/
          mkdir -p _site/data
          cp data/index.json _site/data/
          cp -r data/days _site/data/
          echo "$(date -u +%FT%TZ)" > _site/build.txt

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      # GitHub's cron is best-effort (it is often late or skipped under load), so a
      # successful run schedules its own successor: immediately while the backfill is
      # still catching up, otherwise ~10 min after this run started. Cron stays as a
      # backup; the concurrency group keeps runs from overlapping.
      - name: Schedule the next run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          done=$(node -p "const s=require('./data/state.json'); !s.cursors.backfill || s.cursors.backfill.lastBlock >= s.cursors.backfill.endBlock")
          if [ "$done" = "true" ]; then
            start=$(date -d "$(gh run view ${{ github.run_id }} --json createdAt --jq .createdAt)" +%s)
            wait=$(( 600 - ( $(date +%s) - start ) ))
            if [ "$wait" -gt 0 ]; then echo "backfill done; sleeping ${wait}s before the next run"; sleep "$wait"; fi
          else
            echo "backfill still running; re-dispatching immediately"
          fi
          gh workflow run gas-dashboard --ref "${GITHUB_REF_NAME}"
